<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社有車管理 - キャッスルハウス</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            padding: 1rem;
            line-height: 1.6;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333;
        }
        
        .subtitle {
            font-size: 12px;
            color: #999;
            margin-bottom: 1.5rem;
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
        }
        
        .tab-btn {
            padding: 10px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #999;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            color: #333;
            border-bottom-color: #4ECDC4;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-section {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .form-grid.full {
            grid-template-columns: 1fr;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        label {
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            max-width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4ECDC4;
            box-shadow: 0 0 0 2px rgba(78, 205, 196, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 1rem;
        }
        
        button {
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid #ddd;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .btn-reset {
            background: white;
            color: #333;
            border: 1px solid #ddd;
        }
        
        .btn-reset:hover {
            background: #f5f5f5;
        }
        
        .btn-save {
            background: #4ECDC4;
            color: white;
            border: none;
            grid-column: 1 / 3;
        }
        
        .btn-save:hover {
            background: #3eb8ae;
        }
        
        .success-message {
            background: #e8f8f5;
            color: #0f6e56;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .history-container {
            max-height: 500px;
            overflow-y: auto;
        }
        
        .history-item {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 4px solid #4ECDC4;
        }
        
        .history-item.urgent {
            border-left-color: #FF6B6B;
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }
        
        .history-title {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .history-date {
            font-size: 12px;
            color: #999;
        }
        
        .history-detail {
            font-size: 12px;
            color: #666;
            margin: 4px 0;
        }
        
        .category-badge {
            display: inline-block;
            background: #4ECDC4;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 6px;
        }
        
        .category-badge.oil {
            background: #FFA500;
        }
        
        .category-badge.inspection {
            background: #9B59B6;
        }
        
        .category-badge.tire {
            background: #3498DB;
        }
        
        .category-badge.repair {
            background: #E74C3C;
        }
        
        .empty-message {
            text-align: center;
            color: #999;
            padding: 2rem 1rem;
            font-size: 14px;
        }
        
        .stats {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .stat-box {
            text-align: center;
        }
        
        .stat-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 社有車管理</h1>
        <p class="subtitle">車検・整備・修理の記録管理</p>
        
        <div id="successMessage" class="success-message">記録を保存しました！</div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('new')">新規記録</button>
            <button class="tab-btn" onclick="switchTab('history')">整備履歴</button>
        </div>
        
        <!-- 新規記録タブ -->
        <div id="new" class="tab-content active">
            <div class="form-section">
                <h2 style="font-size: 16px; margin-bottom: 1rem;">整備・修理記録</h2>
                
                <div class="form-grid">
                    <div class="input-group">
                        <label for="date">実施日 <span style="color: red;">*必須</span></label>
                        <input type="date" id="date">
                    </div>
                    <div class="input-group">
                        <label for="user">使用者 <span style="color: red;">*必須</span></label>
                        <input type="text" id="user" placeholder="名前を入力">
                    </div>
                </div>
                
                <div class="form-grid full" style="margin-top: 12px;">
                    <div class="input-group">
                        <label for="carInfo">車種・ナンバー <span style="color: red;">*必須</span></label>
                        <input type="text" id="carInfo" placeholder="例：トヨタ・プリウス（福岡501ア1234）">
                    </div>
                </div>
                
                <div class="form-grid" style="margin-top: 12px;">
                    <div class="input-group">
                        <label for="distance">実施時走行距離(km)</label>
                        <input type="number" id="distance" placeholder="km">
                    </div>
                    <div class="input-group">
                        <label for="category">区分 <span style="color: red;">*必須</span></label>
                        <select id="category">
                            <option value="">選択してください</option>
                            <option value="inspection">定期点検</option>
                            <option value="oil">オイル交換</option>
                            <option value="inspection_major">車検</option>
                            <option value="tire">タイヤ交換</option>
                            <option value="repair">修理</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-grid full" style="margin-top: 12px;">
                    <div class="input-group">
                        <label for="content">実施内容</label>
                        <textarea id="content" placeholder="例：エンジンオイル・オイルフィルター交換"></textarea>
                    </div>
                </div>
                
                <div class="form-grid" style="margin-top: 12px;">
                    <div class="input-group">
                        <label for="shop">実施店・整備工場</label>
                        <input type="text" id="shop" placeholder="例：〇〇自動車整備工場">
                    </div>
                    <div class="input-group">
                        <label for="cost">費用(税込)</label>
                        <input type="number" id="cost" placeholder="円">
                    </div>
                </div>
                
                <div class="form-grid full" style="margin-top: 12px;">
                    <div class="input-group">
                        <label for="nextSchedule">次回目安（日数）</label>
                        <input type="number" id="nextSchedule" placeholder="例：180（日）">
                    </div>
                </div>
                
                <div class="form-grid full" style="margin-top: 12px;">
                    <div class="input-group">
                        <label for="memo">備考</label>
                        <textarea id="memo" placeholder="その他の情報"></textarea>
                    </div>
                </div>
                
                <div class="btn-group">
                    <button class="btn-reset" onclick="resetForm()">リセット</button>
                    <button class="btn-save" onclick="saveRecord()">記録を保存</button>
                </div>
            </div>
        </div>
        
        <!-- 整備履歴タブ -->
        <div id="history" class="tab-content">
            <div class="form-section">
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-label">総記録数</div>
                        <div class="stat-value" id="totalCount">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">今月の費用</div>
                        <div class="stat-value" id="monthCost">¥0</div>
                    </div>
                </div>
            </div>
            
            <div class="history-container" id="historyList">
                <div class="empty-message">まだ記録がありません</div>
            </div>
        </div>
    </div>

    <script>
        const categories = {
            'inspection': '定期点検',
            'oil': 'オイル交換',
            'inspection_major': '車検',
            'tire': 'タイヤ交換',
            'repair': '修理'
        };

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            
            if (tab === 'history') {
                displayHistory();
            }
        }

        function saveRecord() {
            const date = document.getElementById('date').value;
            const user = document.getElementById('user').value;
            const carInfo = document.getElementById('carInfo').value;
            const category = document.getElementById('category').value;
            
            if (!date || !user || !carInfo || !category) {
                alert('必須項目を入力してください');
                return;
            }
            
            const record = {
                date,
                user,
                carInfo,
                distance: document.getElementById('distance').value || '-',
                category,
                content: document.getElementById('content').value,
                shop: document.getElementById('shop').value,
                cost: document.getElementById('cost').value || 0,
                nextSchedule: document.getElementById('nextSchedule').value,
                memo: document.getElementById('memo').value,
                savedAt: new Date().toLocaleString('ja-JP')
            };
            
            let records = JSON.parse(localStorage.getItem('carRecords') || '[]');
            records.unshift(record);
            localStorage.setItem('carRecords', JSON.stringify(records));
            
            const msg = document.getElementById('successMessage');
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 2000);
            
            resetForm();
        }

        function resetForm() {
            document.getElementById('date').value = '';
            document.getElementById('user').value = '';
            document.getElementById('carInfo').value = '';
            document.getElementById('distance').value = '';
            document.getElementById('category').value = '';
            document.getElementById('content').value = '';
            document.getElementById('shop').value = '';
            document.getElementById('cost').value = '';
            document.getElementById('nextSchedule').value = '';
            document.getElementById('memo').value = '';
        }

        function getCategoryBadgeClass(category) {
            const classes = {
                'inspection': 'inspection',
                'oil': 'oil',
                'inspection_major': 'inspection',
                'tire': 'tire',
                'repair': 'repair'
            };
            return classes[category] || '';
        }

        function displayHistory() {
            const records = JSON.parse(localStorage.getItem('carRecords') || '[]');
            const container = document.getElementById('historyList');
            
            if (records.length === 0) {
                container.innerHTML = '<div class="empty-message">まだ記録がありません</div>';
                document.getElementById('totalCount').textContent = '0';
                document.getElementById('monthCost').textContent = '¥0';
                return;
            }
            
            // 統計計算
            const now = new Date();
            const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            let monthCost = 0;
            
            records.forEach(record => {
                if (record.date.startsWith(currentMonth)) {
                    monthCost += parseInt(record.cost) || 0;
                }
            });
            
            document.getElementById('totalCount').textContent = records.length;
            document.getElementById('monthCost').textContent = `¥${monthCost.toLocaleString()}`;
            
            // 履歴表示
            container.innerHTML = records.map((record, idx) => `
                <div class="history-item ${record.category === 'repair' ? 'urgent' : ''}">
                    <div class="history-header">
                        <div>
                            <span class="category-badge ${getCategoryBadgeClass(record.category)}">
                                ${categories[record.category]}
                            </span>
                            <span class="history-title">${record.carInfo}</span>
                        </div>
                        <span class="history-date">${record.date}</span>
                    </div>
                    <div class="history-detail">
                        <strong>使用者:</strong> ${record.user}
                        ${record.distance !== '-' ? ` | <strong>走行距離:</strong> ${record.distance}km` : ''}
                    </div>
                    ${record.content ? `<div class="history-detail"><strong>内容:</strong> ${record.content}</div>` : ''}
                    ${record.shop ? `<div class="history-detail"><strong>実施店:</strong> ${record.shop}</div>` : ''}
                    ${record.cost ? `<div class="history-detail"><strong>費用:</strong> ¥${parseInt(record.cost).toLocaleString()}</div>` : ''}
                    ${record.nextSchedule ? `<div class="history-detail"><strong>次回目安:</strong> ${record.nextSchedule}日後</div>` : ''}
                    ${record.memo ? `<div class="history-detail"><strong>備考:</strong> ${record.memo}</div>` : ''}
                </div>
            `).join('');
        }

        // 初期化
        document.getElementById('date').valueAsDate = new Date();
    </script>
</body>
</html>
